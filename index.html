<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Soul Lost</title>
    <meta name="description" content="Soul Lost - An intelligent, multimodal AI assistant with A-to-Z Admin Command Center, customizable interface controls, real-time user management, Google Sign-in, anti-bot CAPTCHA, web search grounding, image studio, and vision analysis." />
    <meta property="og:title" content="Soul Lost" />
    <meta property="og:description" content="Soul Lost - An intelligent, multimodal AI assistant with A-to-Z Admin Command Center, customizable interface controls, real-time user management, Google Sign-in, anti-bot CAPTCHA, web search grounding, image studio, and vision analysis." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    <script>
      (function() {
        try {
          const s = localStorage.getItem('soullost_settings_v1') || localStorage.getItem('fruitfly_settings_v1');
          if (s) {
            const p = JSON.parse(s);
            if (p.theme === 'dark') {
              document.documentElement.classList.add('dark');
              document.documentElement.setAttribute('data-theme', 'dark');
            } else {
              document.documentElement.classList.remove('dark');
              document.documentElement.setAttribute('data-theme', 'light');
            }
          }
        } catch(e) {}
      })();
    </script>
  </head>
  <body class="font-['Plus_Jakarta_Sans',sans-serif] antialiased">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
